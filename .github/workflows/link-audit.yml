name: Route & Link Integrity Audit

on:
  schedule:
    # Run every morning at 04:00 UTC (09:30 AM IST)
    - cron: '0 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'

jobs:
  audit-links:
    name: Verify StackEdit++ Links & Route Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # lychee is a Rust binary, not an npm package (npm "lychee" is an unrelated library)
      - name: Run Markdown Link Integrity Crawler
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --verbose
            --user-agent "StackEditCommunityLinkAuditBot/1.0 (+https://stackeditplusplus.meshworld.in)"
            --accept "200,206,301,302,307,308"
            --timeout 15
            --max-retries 3
            --exclude "https://github.com/cooldashing24/stackedit-community/.*"
            README.md
            'docs/**/*.md'
